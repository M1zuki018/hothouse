<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HOTHOUSE モック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: 静かで冷たい夜。言葉は少なく、硝子越しに見る
   IDEA: 温室。黒い夜を金の骨組みが区切り、UIはすべて硝子の板
   PICTURE: WebGLで描く背景・仮立ち絵と、それを屈折させるliquid glass
   COLOUR/TYPE: 黒・金・銀、ルネだけ薔薇色／Shippori Mincho＋Cormorant Garamond
   LAYOUT: 1920×1080固定ステージをウィンドウに合わせて拡縮 */
:root{color-scheme:dark;--gold:#d9ae55;--silver:#c9ccd6;--ink:#f3f1ec;--mute:#a7a6ad}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{font:16px/1.55 "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;color:var(--ink)}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;background:#000;user-select:none}
#gl{position:absolute;inset:0;width:1920px;height:1080px}
.shake{animation:shake .5s linear}
@keyframes shake{0%,100%{translate:0 0}20%{translate:-14px 6px}40%{translate:12px -8px}60%{translate:-8px 4px}80%{translate:6px -3px}}
.layer{position:absolute;inset:0}
.hidden{display:none!important}
.glass{border-radius:36px;transition:opacity .28s}
#phase,#dialog,#toast,.panel{position:absolute}
.nogl .glass{background:rgba(18,18,26,.55);backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(255,255,255,.16)}
.nogl #gl{background:radial-gradient(circle at 50% 28%,#2a2a33,#050507 60%)}
.fadeable{opacity:0;pointer-events:none}
.fadeable.on{opacity:1;pointer-events:auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
/* title */
#title .logo{position:absolute;left:0;right:0;top:520px;text-align:center;font:600 132px/1 "Cormorant Garamond",serif;letter-spacing:.32em;padding-left:.32em;background:linear-gradient(180deg,#f6e2ad,#b8892f 70%,#7a5a1d);-webkit-background-clip:text;background-clip:text;color:transparent}
#title .sub{position:absolute;left:0;right:0;top:680px;text-align:center;font-size:24px;color:var(--silver);letter-spacing:.4em}
#title .menu{position:absolute;left:760px;top:780px;width:400px;display:grid;gap:22px}
.gbtn{position:relative;height:76px;border-radius:38px;font-size:28px;letter-spacing:.2em;color:var(--ink)}
.gbtn:hover{color:#fff;text-shadow:0 0 18px rgba(255,236,190,.7)}
.gbtn[aria-disabled=true]{color:var(--mute)}
#title .note{position:absolute;left:0;right:0;bottom:40px;text-align:center;font-size:18px;color:var(--mute)}
/* in-game */
#phase{left:64px;top:56px;display:flex;align-items:baseline;gap:18px;font-size:25px;letter-spacing:.12em;text-shadow:0 2px 18px #000}
#phase b{color:var(--gold);font-weight:600}
#phase span{color:var(--ink)}
#hud{position:absolute;z-index:1;right:54px;bottom:10px;display:flex;align-items:center;gap:12px}
#hudItems{display:flex;gap:10px}
#hudItems[hidden]{display:none}
.hbtn,#hudToggle{min-width:64px;height:50px;color:var(--ink);text-shadow:0 2px 8px #000,0 0 14px #000}
.hbtn{padding:0 12px;font:600 22px/1 "Cormorant Garamond",serif;letter-spacing:.13em}
.hbtn:hover,.hbtn.on,#hudToggle{color:var(--gold)}
#hudToggle{font-size:26px}
/* 没入：HUDは右下の隅に触れたときだけ。普段は画面に文字以外を出さない */
#hud{opacity:0;transition:opacity .45s}
#hud.awake,#hud:focus-within{opacity:1}
/* 星のHUD：隅の星が集まって文字になり、離れるとほどけて夜空に還る */
#hudSky{position:absolute;right:0;bottom:0;width:820px;height:230px;pointer-events:none}
#hud.awake .hbtn{animation:hudIn .55s .45s both}
@keyframes hudIn{from{opacity:0;filter:blur(3px)}to{opacity:1;filter:none}}
@media (prefers-reduced-motion:reduce){#hud.awake .hbtn{animation-delay:0s}}
#hud #hudToggle{opacity:0;transition:opacity .3s}
#hud.awake #hudToggle,#hud:focus-within #hudToggle{opacity:1}
.choosing #hudSky,.silent #hudSky,#game.hidetext #hudSky{visibility:hidden}
#modeMark{position:absolute;right:66px;bottom:26px;font:600 20px/1 "Cormorant Garamond",serif;letter-spacing:.3em;color:var(--gold);text-shadow:0 0 12px #000;opacity:0;transition:opacity .4s;pointer-events:none}
#modeMark.on{opacity:.55;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.25}}
#dialog.ready .nx{animation:breathe 2s ease-in-out infinite}
#game:has(#hud.awake) #modeMark{visibility:hidden}
#game.hidetext #dialog,#game.hidetext #phase,#game.hidetext #hud,#game.hidetext #modeMark{visibility:hidden}
#dialog{inset:0;transition:opacity .2s}
#dialog,#dialog.on{pointer-events:none}
#dialog::before{content:"";position:absolute;inset:59% 0 0;background:linear-gradient(transparent,rgba(8,7,12,.88))}
#dialog.still::before{top:76%;background:linear-gradient(transparent,rgba(8,7,12,.62))}
#dialog.monologue{z-index:3}
#dialog.monologue::before{inset:0;background:radial-gradient(ellipse at center,rgba(8,7,12,.78),transparent 68%)}
.caption{position:absolute;left:50%;bottom:64px;translate:-50% 0;width:1220px;text-align:center;text-shadow:0 2px 12px #000,0 0 24px #000}
#dialog.still .caption{bottom:54px;width:1400px}
#dialog.monologue .caption{top:50%;bottom:auto;translate:-50% -50%;width:1080px}
#dialog .nm{position:absolute;bottom:100%;left:0;right:0;margin-bottom:14px;font-size:24px;font-weight:600;letter-spacing:.32em;padding-left:.32em;display:flex;align-items:center;justify-content:center;gap:18px}
/* 名前：左右に細い金の線が伸びる */
#dialog .nm::before,#dialog .nm::after{content:"";width:46px;height:1px;background:linear-gradient(90deg,transparent,currentColor);opacity:.7;transform-origin:right;animation:nmLine .6s cubic-bezier(.2,.8,.2,1) both}
#dialog .nm::after{background:linear-gradient(90deg,currentColor,transparent);transform-origin:left}
#dialog:has(.tx.long) .nm{justify-content:flex-start;padding-left:0}
#dialog:has(.tx.long) .nm::before{display:none}
@keyframes nmLine{from{transform:scaleX(0);opacity:0}}
#dialog .nm.enter{animation:nmIn .5s ease-out both}
@keyframes nmIn{from{opacity:0;letter-spacing:.6em;filter:blur(4px)}}
/* 本文：一文字ずつ、にじむように浮かび上がる。最初は金に光り、すぐ白に落ち着く */
#dialog .tx .ch{display:inline;animation:chIn .62s cubic-bezier(.25,.7,.25,1) both;animation-delay:var(--d)}
@keyframes chIn{0%{opacity:0;filter:blur(7px);color:#f6e2ad;text-shadow:0 0 22px rgba(217,174,85,.9),0 2px 12px #000}55%{opacity:1;filter:blur(0);color:#fbf1d8}100%{opacity:1;filter:none}}
#dialog .tx.done .ch{animation:none}
#dialog .nm:empty,.monologue .nm{display:none}
#dialog .tx{min-height:1.65em;font-size:42px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;text-wrap:pretty}
#dialog.still .tx{font-size:36px}
#dialog .tx.long{text-align:left}
.silent #hud,.silent #phase{visibility:hidden}
#dialog .nx{position:absolute;top:100%;left:50%;translate:-50% 4px;color:var(--gold);font-size:19px;opacity:0}
#dialog.ready .nx{opacity:1}
#dialog.still .nx{visibility:hidden}
#choices{position:absolute;inset:0;pointer-events:none}
.ink{position:absolute;width:640px;height:120px;padding:0 20px;font-size:34px;letter-spacing:.1em;color:transparent;pointer-events:auto;transition:color .7s .3s,text-shadow .3s}
.ink.on{color:var(--ink)}
.ink.on:hover{color:#fff;text-shadow:0 0 18px rgba(217,174,85,.85)}
.ink::before{content:"";display:inline-block;width:10px;height:10px;margin:0 18px 4px 0;background:var(--gold);rotate:45deg;opacity:0;transition:opacity .3s}
.ink.on:hover::before{opacity:1}
.s0{left:90px;top:150px;text-align:left}.s1{right:90px;top:150px;text-align:right}
.s2{left:90px;bottom:110px;text-align:left}.s3{right:90px;bottom:110px;text-align:right}
.choosing:not(.keep) #dialog::before{inset:0;background:radial-gradient(ellipse at center,rgba(8,7,12,.83),transparent 64%)}
.choosing:not(.keep) #dialog .caption{top:50%;bottom:auto;translate:-50% -50%;width:770px}
.choosing #phase,.choosing #hud{visibility:hidden}
.choosing:not(.keep) #dialog.on{transition:opacity .45s ease-out}
.nogl .ink{background:rgba(5,5,8,.85);border-radius:60px;opacity:0;transition:opacity .8s,color .7s .3s}.nogl .ink.on{opacity:1}
/* dialogs */
.dlg{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.panel{left:50%;top:50%;translate:-50% -50%;padding:56px 64px;border-radius:40px}
.panel h2{margin:0 0 28px;font-size:34px;font-weight:600;letter-spacing:.15em}
.panel .row{display:flex;gap:20px;justify-content:center;margin-top:34px}
.panel .row .gbtn{width:260px}
#nameIn{width:560px;height:76px;padding:0 30px;font:36px "Shippori Mincho",serif;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.25);border-radius:20px}
#logList{width:1300px;height:640px;overflow-y:auto;padding-right:16px}
#logList p{margin:0 0 22px;font-size:26px;line-height:1.6}
#logList b{display:block;font-size:20px;color:var(--gold)}
#fader{position:absolute;inset:0;background:#000;pointer-events:none;opacity:1}
#flash{position:absolute;inset:0;background:#fff;pointer-events:none;opacity:0}
#toast{left:50%;bottom:120px;translate:-50% 0;padding:20px 40px;border-radius:30px;font-size:22px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.shake,.prow.glitch,#dialog .nx{animation:none}}

/* ---- デバッグウィンドウ（Aube の AubeDebugWindow 相当）---- */
#debug{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.45);font:20px/1.5 system-ui,"Hiragino Sans","Yu Gothic",sans-serif;color:#e8e8ee}
#debug .win{position:absolute;left:50%;top:50%;translate:-50% -50%;width:1400px;height:820px;display:grid;grid-template-columns:240px 1fr;grid-template-rows:64px 1fr;background:#14141b;border:1px solid #3a3a48;border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
#debug .bar{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 20px;background:#1d1d27;border-bottom:1px solid #2c2c38}
#debug .bar b{font-size:22px;letter-spacing:.08em}#debug .bar small{color:#8a8a99}
#debug .bar .x{margin-left:auto;width:44px;height:44px;border-radius:8px;font-size:26px;color:#aaa}
#debug .bar .x:hover{background:#2a2a36;color:#fff}
#debug .tabs{background:#181820;border-right:1px solid #2c2c38;overflow-y:auto;padding:8px}
#debug .tabs button{display:block;width:100%;text-align:left;padding:12px 16px;border-radius:8px;color:#b8b8c6;font:inherit}
#debug .tabs button.on{background:#2b2b3a;color:#fff}
#debug .tabs button:hover{background:#23232f}
#debug .rows{overflow-y:auto;padding:12px 20px}
#debug .row{display:flex;align-items:center;gap:16px;min-height:60px;padding:8px 4px;border-bottom:1px solid #23232e}
#debug .row .lb{flex:1;min-width:0}
#debug .row .lb small{display:block;color:#7d7d8c;font-size:15px}
#debug .row button.act{padding:8px 18px;border-radius:8px;background:#3b3b52;color:#fff;font:inherit;font-size:18px;white-space:nowrap}
#debug .row button.act:hover{background:#4c4c6a}
#debug .row input[type=text]{width:320px;padding:8px 12px;border-radius:8px;border:1px solid #3a3a48;background:#0f0f15;color:#fff;font:inherit;font-size:18px}
#debug .row input[type=checkbox]{width:28px;height:28px;accent-color:#d9ae55}
#debug .row .val{color:#d9ae55;font-variant-numeric:tabular-nums}
#debug .group{margin:18px 4px 4px;color:#d9ae55;font-size:16px;letter-spacing:.1em}
#debug pre{margin:0;white-space:pre-wrap;font:16px/1.6 ui-monospace,monospace;color:#cfcfda}
#debugBtn{position:absolute;left:14px;top:14px;z-index:49;padding:6px 12px;border-radius:8px;background:rgba(20,20,27,.7);color:#d9ae55;font:600 16px system-ui;letter-spacing:.1em}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1920" height="1080"></canvas>

  <div id="title" class="layer">
    <div class="logo">HOTHOUSE</div>
    <div class="sub">温室の死者たち</div>
    <div class="menu">
      <button class="gbtn glass" id="bStart">はじめから</button>
      <button class="gbtn glass" id="bConf" aria-disabled="true">設定</button>
    </div>
    <div class="note">モック版　素材はすべて仮　クリック／Enter：送る　ホイール上：ログ　右クリック／H：文字を隠す　Ctrl：スキップ　A：オート</div>
  </div>

  <div id="game" class="layer hidden">
    <div id="phase" class="fadeable"><b></b><span></span></div>
    <canvas id="hudSky" aria-hidden="true"></canvas>
    <div id="hud">
      <div id="hudItems" hidden>
        <button class="hbtn" id="hLog">LOG</button>
        <button class="hbtn" id="hAuto" aria-pressed="false">AUTO</button>
        <button class="hbtn" id="hSkip" aria-pressed="false">SKIP</button>
        <button class="hbtn" id="hMenu">MENU</button>
      </div>
      <button id="hudToggle" aria-label="操作メニュー" aria-controls="hudItems" aria-expanded="false">✦</button>
    </div>
    <div id="choices" class="hidden"></div>
    <div id="dialog" class="fadeable">
      <div class="caption"><div class="nm"></div><div class="tx"></div><span class="nx" aria-hidden="true">✦</span></div>
    </div>
    <div id="modeMark" aria-live="polite"></div>
  </div>

  <div id="fader"></div>
  <div id="flash"></div>

  <div id="dName" class="dlg hidden"><div class="glass panel">
    <h2>名前を入力</h2>
    <input id="nameIn" maxlength="8" value="ジョナス" aria-label="名前">
    <div class="row"><button class="gbtn glass" id="nDef">デフォルト</button><button class="gbtn glass" id="nOk">決定</button></div>
  </div></div>

  <div id="dLog" class="dlg hidden"><div class="glass panel"><h2>LOG</h2><div id="logList"></div>
    <div class="row"><button class="gbtn glass" data-close="dLog">閉じる</button></div></div></div>

  <div id="dMenu" class="dlg hidden"><div class="glass panel"><h2>MENU</h2>
    <div class="row"><button class="gbtn glass" data-close="dMenu">再開</button><button class="gbtn glass" id="mTitle">タイトルへ</button></div></div></div>

  <div id="dEnd" class="dlg hidden"><div class="glass panel"><h2>おわり</h2>
    <div id="endName" style="font-size:24px;color:var(--silver);text-align:center"></div>
    <div class="row"><button class="gbtn glass" id="eTitle">タイトルへ</button></div></div></div>

  <div id="toast" class="glass fadeable"></div>

  <button id="debugBtn" class="hidden" aria-label="デバッグ">DEBUG</button>
  <div id="debug" class="hidden" role="dialog" aria-label="デバッグ"><div class="win">
    <div class="bar"><b>DEBUG</b><small>Tab で開閉 ／ Esc で閉じる ／ 左上を長押し</small><button class="x" id="debugClose" aria-label="閉じる">×</button></div>
    <div class="tabs" id="debugTabs"></div>
    <div class="rows" id="debugRows"></div>
  </div></div>
</div>

<script>
{
/* ============ 1. シナリオ（Aube の order JSON と同じ列構成） ============ */
// r(order_id, order_type, sequence, speaker_id, dialog_text, override_display_name, file_path, position, duration)
const r = (id, type, seq = 'Append', spk = 0, text = '', over = '', file = '', pos = 'Center', dur = 0, face = 'Default') => ({
  order_id: id, order_type: type, sequence: seq, speaker_id: spk, dialog_text: text,
  override_display_name: over, file_path: file, position: pos, facial_expression: face,
  override_text_speed: 0, duration: dur });
const J = 'Join';
/* ---- 原稿 → order 変換（Notion「セリフ」の書き方そのまま＋演出行 @） ----
   名前：本文 / 表示名＝話者：本文 / 地の文 / ＞選択肢 / （暗転）
   @bg 背景  @in 名前 位置 秒  @out 名前 秒  @clear 秒  @fadein 秒  @fadeout 秒
   @in 名前 位置 秒 表情（表情は省略可：Default / Live など）
   @meteor 秒  @flash 秒  @shake  @wait 秒  @phase 大|小  @head 場面|題|説明
   @cmd 命令（GameCommand をそのまま渡す。例：@cmd param love_j 10; param mourn 6）
   @cg 名前 秒 / @cg off 秒  @shower 強さ 秒  @sparkle 強さ 秒  @monologue 本文
   ＞ラベル（連続行で複数）。直後の ｜行 はその選択肢だけの分岐、分岐後は次の行に合流
   ＞「台詞」のようにラベルを「」で囲むと、選んだあと主人公の台詞として表示
   「台詞」だけの行（または ジョナス：台詞）は、選択肢1つの選択になる。主人公のセリフはすべてプレイヤーが選んで言う
   行頭 + は直前と同時実行（Join） */
const ANCHORS = [];   // デバッグ用：@phase ごとの飛び先 {label, order_id, bg}
const NAME2ID = { カリル:1, フィルウ:2, テオ:3, ジョナス:0, リヴ:5, レイフ:6, ルネ:7 };
let curBg = '';      // 直前の @bg。飛び先に背景を持たせるため
function fromScript(src, id){
  const out = [], on = new Set(); let head = '';
  const add = (join, type, spk=0, text='', over='', file='', pos='Center', dur=0, face='Default') =>
    out.push(r(id++, type, join?J:'Append', spk, text, over, file, pos, dur, face));
  const clear = (join, d) => { let first = true; for (const s of on){ add(join || !first, 'CharacterExit', s, '', '', '', 'Center', d); first = false; } on.clear(); };
  const lines = src.split('\n').map(s=>s.trim()).filter(Boolean);
  for (let i = 0; i < lines.length; i++){
    let L = lines[i], join = false;
    if (L[0] === '+'){ join = true; L = L.slice(1); }
    if (L[0] === '@'){
      const [c, ...a] = L.slice(1).split(/\s+/), n = Number(a.at(-1));
      if (c==='bg'){ curBg = a[0]; add(join,'ChangeBackground',0,'','',a[0]); }
      else if (c==='in'){ on.add(NAME2ID[a[0]]); add(join,'CharacterEntry',NAME2ID[a[0]],'','','',a[1]||'Center',+(a[2]||.5),a[3]||'Default'); }
      else if (c==='out'){ on.delete(NAME2ID[a[0]]); add(join,'CharacterExit',NAME2ID[a[0]],'','','','Center',+(a[1]||.5)); }
      else if (c==='clear') clear(join, +(a[0]||.8));
      else if (c==='fadein')  add(join,'FadeIn',0,'','','','Center',n||1.4);
      else if (c==='fadeout') add(join,'FadeOut',0,'','','','Center',n||1.2);
      else if (c==='meteor')  add(join,'Effect',0,'Meteor','','','Center',n||2.4);
      else if (c==='flash')   add(join,'Effect',0,'Flash','','','Center',n||.5);
      else if (c==='shake')   add(join,'CameraShake');
      else if (c==='wait')    add(join,'Wait',0,'','','','Center',n||1);
      else if (c==='phase'){  ANCHORS.push({label:a.join(' '), order_id:id, bg:curBg}); add(join,'GameCommand',0,'phase '+a.join(' ')); }
      else if (c==='end')     add(join,'End');
      else if (c==='cmd')     add(join,'GameCommand',0,a.join(' '));
      else if (c==='monologue') add(join,'Descriptive',0,a.join(' '),'','','monologue');
      else if (c==='head')    head = a.join(' ');
      else if (c==='cg')      add(join,'ShowCG',0,'','',a[0],'Center',a[1]!==undefined?+a[1]:1);
      else if (c==='shower')  add(join,'Effect',0,'Shower:'+a[0],'','','Center',a[1]!==undefined?+a[1]:1.5);
      else if (c==='sparkle') add(join,'Effect',0,'Sparkle:'+a[0],'','','Center',a[1]!==undefined?+a[1]:1.5);
      continue;
    }
    if (L[0] === '＞'){
      // ＞ラベル の直後に ｜ で始まる行を書くと、その選択肢だけの分岐になる。分岐が終わると次の行へ合流
      // ラベルが「」で囲まれていれば、選んだあとにその台詞を表示する
      const opts = [];
      while ((lines[i]||'')[0] === '＞'){
        const o = { label: lines[i].slice(1), body: [] }; i++;
        while ((lines[i]||'')[0] === '｜') o.body.push(lines[i++].slice(1).trim());
        opts.push(o);
      }
      i--;
      const ci = out.length; add(false,'Choice',0,'',head); head = '';
      const starts = [], jumps = [];
      for (const o of opts){
        starts.push(id);
        if (/^「.*」$/.test(o.label)) add(false,'Descriptive',0,o.label);
        const sub = fromScript(o.body.join('\n'), id); out.push(...sub); id += sub.length;
        jumps.push(out.length); add(false,'Jump',0,'');
      }

const fill = t => t.replaceAll('{player}', S.player);

function tween(dur, fn){
  dur *= S.skip ? .05 : 1;
  return new Promise(res=>{
    if (dur <= 0){ fn(1); res(); return; }
    const t0 = performance.now();
    const step = t => { const k = Math.min(1,(t-t0)/(dur*1000)); fn(k); k<1 ? requestAnimationFrame(step) : res(); };
    requestAnimationFrame(step);
  });
}
const sleep = s => tween(s, ()=>{});

const view = {
  finishReveal:null,
  show(el, on){ el.classList.toggle('on', on); },
  setDialog(name, color, text, mode = ''){
    this.finishReveal?.();
    const d = $('dialog');
    d.classList.remove('ready');
    d.classList.toggle('still', !!R.cg);
    d.classList.toggle('monologue', !R.cg && mode === 'monologue');
    const nm = d.querySelector('.nm');
    nm.textContent = name;
    nm.style.color = color;
    const tx = d.querySelector('.tx');
    tx.classList.toggle('long', text.length > 52 || text.includes('\n'));
    // 話者が変わったときだけ名前を演出し直す
    if (name !== this.lastName){ nm.classList.remove('enter'); void nm.offsetWidth; if (name) nm.classList.add('enter'); }
    this.lastName = name;
    this.show(d, !!text);
    S.log.push({n:name, t:text, c:color});
    const quick = S.skip || matchMedia('(prefers-reduced-motion: reduce)').matches;
    tx.classList.toggle('done', quick);
    tx.textContent = '';
    if (!text) return;
    const chars = [...new Intl.Segmenter('ja', {granularity:'grapheme'}).segment(text)].map(g=>g.segment);
    const step = Math.min(26, 1100 / chars.length);   // 長い文でも1.1秒ほどで出しきる
    const frag = document.createDocumentFragment();
    chars.forEach((c, i)=>{
      if (c === '\n'){ frag.append(document.createElement('br')); return; }
      const sp = document.createElement('span'); sp.className = 'ch'; sp.textContent = c; sp.style.setProperty('--d', (i*step|0)+'ms'); frag.append(sp);
    });
    tx.append(frag);
    if (quick){ d.classList.add('ready'); return; }
    return new Promise(resolve=>{
      const t = setTimeout(()=>this.finishReveal?.(), chars.length*step + 620);
      this.finishReveal = () => {
        clearTimeout(t);
        tx.classList.add('done');
        this.finishReveal = null;
        d.classList.add('ready');
        resolve();
      };
    });
  },
  resetDialog(){
    this.finishReveal?.();
    const d = $('dialog');
    this.show(d, false);
    d.classList.remove('still','monologue','ready');
    this.lastName = null;
    d.querySelector('.tx').textContent = '';
    d.querySelector('.nm').textContent = '';
  },
  showChoices(items, head){
    const d = $('dialog');
    const nm = d.querySelector('.nm'), prompt = d.querySelector('.tx');
    // 見出しがなければ、直前の一言をそのまま画面に残す（消さない・動かさない）
    const keep = !head.join('') && S.log.length > 0;
    this.finishReveal?.();
    d.classList.remove('ready');
    if (!keep){
      // 見出しつき：いったん瞬時に消してから中央に入れ替え、ゆっくり出す（古い文が一瞬映らないように）
      d.style.transition = 'none'; this.show(d, false); void d.offsetWidth; d.style.transition = '';
      d.classList.remove('still','monologue');
      nm.textContent = [head[0],head[1]].filter(Boolean).join('　'); nm.style.color = '#d9ae55'; nm.classList.remove('enter');
      prompt.textContent = fill(head[2]||''); prompt.classList.remove('long');
    }
    $('game').classList.toggle('keep', keep);
    clearTimeout(this.phaseTimer);
    this.show($('phase'), false);
    const box = $('choices'); box.innerHTML = '';
    const slots = {1:[3], 2:[0,3], 3:[0,1,3], 4:[0,1,2,3]}[Math.min(items.length,4)];
    const now = performance.now();
    $('game').classList.add('choosing');
    return new Promise(res=>{
      items.slice(0,4).forEach((it,k)=>{
        const b = document.createElement('button'); b.className = 'cbtn ink s' + slots[k]; b.textContent = fill(it.label);
        b.dataset.slot = slots[k]; b.dataset.t0 = now + k*220;
        setTimeout(()=>b.classList.add('on'), k*220 + 700);
        b.onclick = e => { e.stopPropagation(); clearTimeout(this.choicePromptTimer); box.classList.add('hidden'); $('game').classList.remove('choosing','keep'); S.modal=false; this.resetDialog(); res(it.id); };
        box.append(b);

      box.classList.remove('hidden'); S.modal = true;
      if (!keep) this.choicePromptTimer = setTimeout(()=>{
        if (!box.classList.contains('hidden') && prompt.textContent) this.show(d, true);
      }, 360);
    });
  },
  setPhase(t){

  },

};

const Handlers = new Map();

    const [op, ...a] = line.trim().split(/\s+/);
    if (op==='phase') view.setPhase(a.join(' '));
    else if (op==='param' || op==='anomaly'){
      S.p[a[0]] = Math.max(0, Math.min(100, S.p[a[0]] + Number(a[1])));
    }
  }
}};

});

function waitAdvance(){
  return new Promise(res=>{
    advance = res;
    if (S.skip) autoT = setTimeout(fireAdvance, 60);
    else if (S.auto) autoT = setTimeout(fireAdvance, 1500);
  });
}
function fireAdvance(){
  if (view.finishReveal){ view.finishReveal(); return; }
  if (advance){ const f=advance; advance=null; clearTimeout(autoT); f(); }
}

class StoryPlayer{
  constructor(scene){ this.o = scene.orders; this.i = 0; this.alive = true; this.byId = new Map(this.o.map((x,i)=>[x.order_id,i])); }
  group(){ const g=[this.o[this.i++]]; while(this.i<this.o.length && this.o[this.i].sequence==='Join') g.push(this.o[this.i++]); return g; }
  async run(){
    while (this.alive && this.i < this.o.length){
      const g = this.group();
      const res = await Promise.all(g.map(o=>{ const h=Handlers.get(o.order_type); if(!h){ console.warn('未対応のオーダー', o.order_type); return null; } return h(o); }));
      if (!this.alive) return;
      const jump = res.find(x=>x && x.jump), end = res.find(x=>x && x.end);
      if (end){ onEnd(); return; }
      if (jump){ this.i = this.byId.get(jump.jump); continue; }
      if (g.some(o=>o.order_type==='Talk' || o.order_type==='Descriptive')) await waitAdvance();
    }
  }
}

let player = null;

/* ---- 星のHUD ---- */
const sky = (()=>{
  const cv = $('hudSky'), W = 820, H = 230, ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  let k = 1, P = [], targets = [], raf = 0;
  // 隅にいつも瞬いている星（ここに何かある、という手がかり）
  const idle = Array.from({length:9}, (_,i)=>({ x: W-470+i*52+Math.sin(i*7.1)*18, y: H-40+Math.cos(i*3.3)*12, ph: i*1.7, r: .9+((i*37)%5)/6 }));
  function resize(){ k = Math.min(2, Math.max(1, scale*(devicePixelRatio||1))); cv.width = W*k; cv.height = H*k; }
  function sample(){
    const sr = stage.getBoundingClientRect(), pts = [];
    const off = document.createElement('canvas').getContext('2d');
    for (const b of document.querySelectorAll('#hudItems .hbtn')){
      const r = b.getBoundingClientRect(), cs = getComputedStyle(b);
      const w = Math.ceil(r.width/scale), h = Math.ceil(r.height/scale);
      const x0 = (r.left-sr.left)/scale - (1920-W), y0 = (r.top-sr.top)/scale - (1080-H);
      off.canvas.width = w; off.canvas.height = h; off.clearRect(0,0,w,h);
      off.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`; off.letterSpacing = cs.letterSpacing;
      off.textAlign = 'center'; off.textBaseline = 'middle'; off.fillStyle = '#fff'; off.fillText(b.textContent, w/2, h/2+1);
      const d = off.getImageData(0,0,w,h).data, cand = [];
      for (let y=0; y<h; y+=2) for (let x=0; x<w; x+=2) if (d[(y*w+x)*4+3] > 140) cand.push([x0+x, y0+y]);
      for (let i=cand.length-1; i>0; i--){ const j = Math.random()*(i+1)|0; [cand[i],cand[j]] = [cand[j],cand[i]]; }
      pts.push(...cand.slice(0, 46));
    }
    return pts;
  }
  const ease = t => 1-Math.pow(1-t,3);
  function wake(){
    if (reduce.matches) return;
    targets = sample(); const now = performance.now();
    P = targets.map(([tx,ty], i)=>{ const s = idle[i % idle.length], a = Math.random()*6.28, d = 40+Math.random()*140;
      return { sx: s.x+Math.cos(a)*d, sy: s.y+Math.sin(a)*d*.5, tx, ty, t0: now+Math.random()*180, dur: 520+Math.random()*260, mode:'in' }; });
    loop();
  }
  function sleep(){
    if (reduce.matches || !targets.length) return;
    const now = performance.now();
    P = targets.map(([x,y])=>{ const a = -0.9+Math.random()*1.0, d = 30+Math.random()*80;
      return { sx:x, sy:y, tx: x+Math.cos(a)*d, ty: y+Math.sin(a)*d, t0: now+Math.random()*120, dur: 900+Math.random()*500, mode:'out' }; });
    loop();
  }
  function star(x, y, r, a){
    const g = ctx.createRadialGradient(x,y,0,x,y,r*4);
    g.addColorStop(0, `rgba(255,246,222,${a})`); g.addColorStop(.25, `rgba(232,196,120,${a*.45})`); g.addColorStop(1, 'rgba(217,174,85,0)');
    ctx.fillStyle = g; ctx.fillRect(x-r*4, y-r*4, r*8, r*8);
  }
  function frame(now){
    ctx.setTransform(k,0,0,k,0,0); ctx.clearRect(0,0,W,H); ctx.globalCompositeOperation = 'lighter';
    const awake = $('hud').classList.contains('awake');
    for (const s of idle) star(s.x, s.y, s.r*1.6, (awake ? .05 : .3) + .16*Math.sin(now/700+s.ph));
    let live = false;
    for (const p of P){
      const t = Math.max(0, Math.min(1, (now-p.t0)/p.dur)), e = ease(t);
      const x = p.sx+(p.tx-p.sx)*e, y = p.sy+(p.ty-p.sy)*e;
      const a = p.mode==='in' ? (t<1 ? .25+.65*t : Math.max(0, .9-(now-p.t0-p.dur)/500)) : .8*(1-t);
      if (a > .01){ live = true; star(x, y, p.mode==='in' ? 1.3 : 1.1, a); }
    }
    if (!live) P = [];
    raf = requestAnimationFrame(frame);
  }
  function loop(){ if (!raf) raf = requestAnimationFrame(frame); }
  addEventListener('resize', ()=>requestAnimationFrame(resize));
  return { wake, sleep, start(){ resize(); loop(); } };
})();
function setHud(open, timed = false){
  const was = $('hud').classList.contains('awake');
  clearTimeout(hudTimer);
  if (open && timed) hudTimer = setTimeout(()=>{ if (!$('hud').matches(':focus-within')) setHud(false); }, 3500);  // タップで開いたときだけ時間で閉じる
  if (open === was) return;
  if (!open) sky.sleep();
  $('hud').classList.toggle('awake', open);
  $('hudItems').hidden = !open;
  if (open) sky.wake();
  $('hudToggle').setAttribute('aria-expanded', String(open));
}

});

/* ============ 5.5 デバッグ（Aube の AubeDebugWindow を踏襲） ============
   ・登録簿（DebugRegistry）と画面（DebugWindow）を分ける。登録はいつでもでき、画面は開くたびに組み直す
   ・行の種類：Button / Toggle / Int / String / InputAction / View（Aube の AubeDebugCommand 派生と同じ）
   ・値はコピーせず getter / setter で持つ。開いている間は定期的に読み直す
   ・コマンドの中で例外が出ても、ウィンドウごと壊れないようにする
   ・開き方：Tab キー／画面左上の長押し／3本指の長押し。URL に ?debug=0 を付けると無効 */
const DebugRegistry = (()=>{
  const DEFAULT_CATEGORY = 'その他';
  const list = [];
  const id = c => c.category + '/' + c.label;
  return {
    register(cmd){
      cmd.category = cmd.category || DEFAULT_CATEGORY; cmd.order = cmd.order ?? 0;
      const k = list.findIndex(x=>id(x)===id(cmd));
      k >= 0 ? (list[k] = cmd) : list.push(cmd);
      DebugWindow.refresh();
      return cmd;
    },
    unregisterCategory(category){ for (let i=list.length-1; i>=0; i--) if (list[i].category===category) list.splice(i,1); DebugWindow.refresh(); },
    categories(){ return [...new Set(list.map(x=>x.category))]; },
    commands(category){ return list.filter(x=>x.category===category).map((x,i)=>[x,i]).sort((a,b)=>a[0].order-b[0].order||a[1]-b[1]).map(x=>x[0]); }
  };
})();
const safe = (f, fallback) => { try { return f(); } catch(err){ console.error('[HHDebug] コマンドで例外', err); return fallback; } };

const DebugService = {
  isAvailable: new URLSearchParams(location.search).get('debug') !== '0',
  button(category, label, onClick, {buttonText='実行', order, note}={}){ return DebugRegistry.register({type:'button', category, label, onClick, buttonText, order, note}); },
  toggle(category, label, get, set, {order, note}={}){ return DebugRegistry.register({type:'toggle', category, label, get, set, order, note}); },
  int(category, label, get, set, {min=-Infinity, max=Infinity, order, note}={}){ return DebugRegistry.register({type:'int', category, label, get, set, min, max, order, note}); },
  string(category, label, get, set, {order, note}={}){ return DebugRegistry.register({type:'string', category, label, get, set, order, note}); },
  inputAction(category, label, onSubmit, {placeholder='', buttonText='実行', order, note, value=''}={}){ return DebugRegistry.register({type:'input', category, label, onSubmit, placeholder, buttonText, order, note, last:value}); },
  view(category, label, content, {buttonText='見る', order, note}={}){ return DebugRegistry.register({type:'view', category, label, content, buttonText, order, note}); },
  group(category, label, {order}={}){ return DebugRegistry.register({type:'group', category, label, order}); },
  open(){ DebugWindow.open(); }, close(){ DebugWindow.close(); }, toggleWindow(){ DebugWindow.isOpen() ? DebugWindow.close() : DebugWindow.open(); }
};

const DebugWindow = (()=>{
  let tab = '', viewing = null, timer = 0;
  const root = $('debug'), tabs = $('debugTabs'), rows = $('debugRows');
  const isOpen = () => !root.classList.contains('hidden');
  function open(){ if (!DebugService.isAvailable) return; root.classList.remove('hidden'); viewing = null; build(); clearInterval(timer); timer = setInterval(tick, 500); }
  function close(){ root.classList.add('hidden'); clearInterval(timer); }
  function refresh(){ if (isOpen()) build(); }
  function build(){
    const cats = DebugRegistry.categories();
    if (!cats.includes(tab)) tab = cats[0] || '';
    tabs.innerHTML = '';
    for (const c of cats){ const b = document.createElement('button'); b.textContent = c; b.className = c===tab ? 'on' : ''; b.onclick = ()=>{ tab = c; viewing = null; build(); }; tabs.append(b); }
    rows.innerHTML = '';
    if (viewing){ buildView(); return; }
    for (const cmd of DebugRegistry.commands(tab)) rows.append(row(cmd));
  }
  function buildView(){
    const head = document.createElement('div'); head.className = 'row';
    const lb = document.createElement('div'); lb.className = 'lb'; lb.textContent = viewing.label;
    const back = document.createElement('button'); back.className = 'act'; back.textContent = '戻る'; back.onclick = ()=>{ viewing = null; build(); };
    head.append(lb, back);
    const pre = document.createElement('pre'); pre.textContent = safe(viewing.content, '');
    rows.append(head, pre);
  }
  function row(cmd){
    if (cmd.type === 'group'){ const g = document.createElement('div'); g.className = 'group'; g.textContent = cmd.label; return g; }
    const el = document.createElement('div'); el.className = 'row';
    const lb = document.createElement('div'); lb.className = 'lb'; lb.textContent = cmd.label;
    if (cmd.note){ const n = document.createElement('small'); n.textContent = cmd.note; lb.append(n); }
    el.append(lb);
    const btn = (text, f) => { const b = document.createElement('button'); b.className = 'act'; b.textContent = text; b.onclick = ()=>safe(f); return b; };
    if (cmd.type === 'button') el.append(btn(cmd.buttonText, cmd.onClick));
    else if (cmd.type === 'toggle'){
      const c = document.createElement('input'); c.type = 'checkbox'; c.disabled = !cmd.set;
      c.checked = !!safe(cmd.get, false); c.onchange = ()=>safe(()=>cmd.set(c.checked));
      el._sync = ()=>{ c.checked = !!safe(cmd.get, false); }; el.append(c);
    } else if (cmd.type === 'int' || cmd.type === 'string'){
      if (!cmd.set){ const v = document.createElement('span'); v.className = 'val'; el._sync = ()=>{ v.textContent = String(safe(cmd.get, '')); }; el._sync(); el.append(v); }
      else {
        const i = document.createElement('input'); i.type = 'text'; i.value = String(safe(cmd.get, ''));
        i.onchange = ()=>safe(()=>{ let v = i.value; if (cmd.type==='int'){ v = Math.max(cmd.min, Math.min(cmd.max, parseInt(v,10)||0)); i.value = v; } cmd.set(v); });
        el._sync = ()=>{ if (document.activeElement !== i) i.value = String(safe(cmd.get, '')); }; el.append(i);
      }
    } else if (cmd.type === 'input'){
      const i = document.createElement('input'); i.type = 'text'; i.placeholder = cmd.placeholder; i.value = cmd.last;
      const go = ()=>{ cmd.last = i.value; safe(()=>cmd.onSubmit(i.value)); };
      i.onkeydown = e=>{ e.stopPropagation(); if (e.key==='Enter') go(); };
      el.append(i, btn(cmd.buttonText, go));
    } else if (cmd.type === 'view') el.append(btn(cmd.buttonText, ()=>{ viewing = cmd; build(); }));
    return el;
  }
  function tick(){
    if (viewing){ const pre = rows.querySelector('pre'); if (pre) pre.textContent = safe(viewing.content, ''); return; }
    for (const el of rows.children) el._sync?.();
  }
  // デバッグ画面の操作がゲームに届かないようにする
  for (const ev of ['click','pointerdown','wheel','contextmenu']) root.addEventListener(ev, e=>{ e.stopPropagation(); if (ev==='click' && e.target===root) close(); }, {passive: ev!=='contextmenu'});
  $('debugClose').onclick = close;
  $('debugBtn').onclick = e=>{ e.stopPropagation(); open(); };
  return { open, close, isOpen, refresh };
})();

// 開き方：Tab ／ Esc で閉じる（ゲーム側の keydown より先に拾う）
addEventListener('keydown', e=>{
  if (!DebugService.isAvailable) return;
  if (e.key==='Tab' && !e.target.closest('input')){ e.preventDefault(); e.stopImmediatePropagation(); DebugService.toggleWindow(); return; }
  if (DebugWindow.isOpen()){ if (e.key==='Escape') DebugService.close(); e.stopImmediatePropagation(); }
}, true);
// 左上の長押し（0.8秒）／3本指の長押し
{
  let t = 0; const fingers = new Set();
  stage.addEventListener('pointerdown', e=>{
    if (!DebugService.isAvailable || DebugWindow.isOpen()) return;
    fingers.add(e.pointerId);
    const b = stage.getBoundingClientRect(), x = (e.clientX-b.left)/scale, y = (e.clientY-b.top)/scale;
    if ((x < 160 && y < 160) || fingers.size >= 3){ clearTimeout(t); t = setTimeout(()=>{ longPressed = true; DebugService.open(); }, 800); }
  }, true);
  for (const ev of ['pointerup','pointercancel']) stage.addEventListener(ev, e=>{ fingers.delete(e.pointerId); clearTimeout(t); }, true);
}

// 指定の order_id から再生する。途中から入るので、背景と画面の状態だけ整えてから始める
function playFrom(orderId, bg){
  const idx = SCENE.orders.findIndex(o=>o.order_id===orderId);
  if (idx < 0){ view.toast('order_id が見つかりません：' + orderId); return; }
  if (player) player.alive = false;
  advance = null; clearTimeout(autoT);
  for (const id of ['dMenu','dEnd','dLog','dName']) $(id).classList.add('hidden');
  $('choices').classList.add('hidden'); $('game').classList.remove('choosing','keep','silent'); view.resetDialog();
  S.modal = false; S.auto = S.skip = false; skipHeld = false; markMode(); setHideText(false);
  if (!S.player) S.player = 'ジョナス';
  R.chars.forEach(c=>{ c.a=0; c.id=0; }); R.cg=''; R.cgA=0; R.shower=0; R.sparkle=0; R.meteor=0;
  if (bg){ R.bg = bg; R.scene = SCENES[bg] ?? 0; }
  $('fader').style.opacity = 0;

/* ============ 6. WebGL：背景・仮立ち絵・liquid glass ============ */
const FS = `precision highp float;
uniform vec2 uRes;uniform float uPx,uTime,uScene,uMeteor;
uniform vec4 uChar[3];uniform vec3 uCol[3];uniform float uSp[3];
uniform vec4 uGlass[14];uniform float uGR[14];uniform float uGA[14];uniform int uGN;
uniform vec4 uCP;uniform vec4 uCH;
#ifdef INK_TEXTURE
uniform sampler2D uInk;
uniform float uInkOn;
#endif
uniform sampler2D uBg,uCG,uT0,uT1,uT2,uFxM,uFxS,uFxK;uniform float uBgOn,uCGA,uFxOn;uniform float uTOn[3];uniform vec4 uTR[3];uniform vec2 uFx;
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float sdB(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,q.y),0.)-r;}
float star(vec2 p,float cell,float th){vec2 g=floor(p/cell),f=fract(p/cell);float h=h21(g);vec2 o=vec2(h21(g+3.1),h21(g+9.7))*.8+.1;float d=length((f-o)*cell);return step(th,h)*exp(-d*d*.35)*(.55+.45*sin(uTime*1.7+h*60.))*(.5+h);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1.,0.)),f.x),mix(h21(i+vec2(0.,1.)),h21(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*vn(p);p*=2.03;a*=.5;}return s;}
float seg(vec2 p,vec2 a,vec2 b){vec2 pa=p-a,ba=b-a;float t=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*t);}
vec3 lab(vec2 p){vec2 uv=p/uRes;vec3 c=mix(vec3(.035,.035,.045),vec3(.01,.01,.014),uv.y);
 vec3 gold=vec3(.86,.68,.33);float arch=1500.-length(p-vec2(960.,1600.));float ins=step(0.,arch);
 float gx=abs(fract((p.x-960.)/180.+.5)-.5)*180.;
 c+=gold*(exp(-gx*gx*.5)*ins*(1.-smoothstep(150.,1080.,p.y))*.35+exp(-arch*arch*.12)*.8+exp(-pow(p.y-770.,2.)*.25)*ins*.22);
 c+=vec3(.6,.62,.7)*.03*(.5+.5*sin((p.x+p.y)*.004+1.))*ins;
 vec2 sp=p-vec2(960.,300.);float sr=length(sp);
 c+=vec3(.86,.89,.97)*(exp(-sr*.035)+exp(-sr*.006)*.22+(exp(-abs(sp.x)*.6)*exp(-abs(sp.y)*.018)+exp(-abs(sp.y)*.6)*exp(-abs(sp.x)*.018))*.45)*(.88+.12*sin(uTime*1.3));
 c+=vec3(.8,.82,.9)*star(p+vec2(0.,uTime*8.),28.,.9)*.5;return c;}
vec3 obs(vec2 p){vec2 uv=p/uRes;vec3 c=mix(vec3(.012,.022,.07),vec3(.1,.065,.15),uv.y);
 c+=vec3(.95,.93,1.)*star(p,20.,.86)+vec3(.95,.85,.65)*star(p+33.,47.,.93)*1.2;
 for(int i=0;i<4;i++){float fi=float(i),t=fract(uTime*.11+fi*.27);vec2 a=vec2(380.+fi*430.+t*520.,70.+fi*55.+t*300.),b=a-vec2(230.,135.);
  float al=clamp(dot(p-b,a-b)/dot(a-b,a-b),0.,1.);float d=seg(p,a,b);c+=vec3(.9,.92,1.)*exp(-d*d*.5)*al*smoothstep(0.,.1,t)*(1.-smoothstep(.55,.85,t))*.9;}
 if(uMeteor>0.){vec2 a=mix(vec2(1700.,-40.),vec2(620.,560.),uMeteor),b=a+vec2(620.,-340.);float al=clamp(dot(p-b,a-b)/dot(a-b,a-b),0.,1.);float d=seg(p,a,b);
  c+=vec3(1.,.95,.85)*(exp(-d*d*.08)*al*al*2.+exp(-length(p-a)*.02)*.8)*(1.-uMeteor*.6);}
 c+=vec3(1.,.75,.4)*exp(-length((p-vec2(1640.,912.))*vec2(1.,2.))*.08)*1.3;
 if(p.y>930.)c=vec3(.018,.017,.025);
 c+=vec3(.86,.68,.33)*(exp(-pow(p.y-930.,2.)*.15)*.7+step(930.,p.y)*exp(-pow(abs(fract(p.x/140.)-.5)*140.,2.)*.3)*.3);return c;}
vec3 church(vec2 p){vec2 uv=p/uRes;vec3 c=mix(vec3(.17,.12,.16),vec3(.045,.045,.07),uv.y);vec2 q=p-vec2(960.,430.);
 float w=sdB(q,vec2(190.,300.),190.);
 if(w<0.){vec2 g=floor(q/56.);float h=h21(g);vec3 pal=h<.33?vec3(.9,.45,.56):(h<.66?vec3(.33,.45,.85):vec3(.92,.72,.36));
  float lead=min(abs(fract(q.x/56.)-.5),abs(fract(q.y/56.)-.5));c=mix(vec3(.04),pal*(.75+.25*sin(uTime*.6+h*9.)),smoothstep(.03,.09,lead));}
 c+=vec3(.95,.6,.72)*.22*exp(-max(w,0.)*.012);
 c+=vec3(1.,.82,.86)*.05*smoothstep(.0,1.,1.-abs((p.x-960.)/(260.+p.y*.5)))*step(730.,p.y);
 if(p.y>930.)c*=.45;return c;}
vec3 chars(vec3 c,vec2 p){for(int i=0;i<3;i++){vec4 ch=uChar[i];if(ch.y<=0.||uTOn[i]>.5)continue;float s=ch.z,gh=ch.w;
 vec2 q=p;q.x+=sin(p.y*.045+uTime*3.)*2.5*gh;
 float d=min(length(q-vec2(ch.x,1080.-640.*s))-78.*s,sdB(q-vec2(ch.x,1080.-250.*s),vec2(135.*s,300.*s),75.*s));
 float inside=1.-smoothstep(-1.5,1.5,d);float top=1080.-730.*s;float k=clamp((p.y-top)/(730.*s),0.,1.);
 vec3 col=mix(uCol[i]*.5,uCol[i]*.12,k)+uCol[i]*exp(-abs(d)*.22)*.9;col*=mix(.45,1.,uSp[i]);
 float a=inside*ch.y*mix(1.,.6+.08*sin(uTime*2.+p.y*.02),gh)*(1.-gh*smoothstep(800.,1080.,p.y)*.8);
 c=mix(c,col,a);c+=uCol[i]*exp(-max(d,0.)*.04)*.12*gh*ch.y;}return c;}
vec4 chTex(int i,vec2 uv){if(i==0)return texture2D(uT0,uv);if(i==1)return texture2D(uT1,uv);return texture2D(uT2,uv);}
vec2 cover(vec2 p){vec2 uv=p/uRes;uv.y=.5+(uv.y-.5)*.84375;return uv;}
vec3 sprites(vec3 c,vec2 p){for(int i=0;i<3;i++){vec4 ch=uChar[i];if(ch.y<=0.||uTOn[i]<.5)continue;float gh=ch.w;vec4 r=uTR[i];
 vec2 q=p;q.x+=sin(p.y*.03+uTime*2.)*3.*gh;vec2 uv=(q-r.xy)/r.zw;if(uv.x<0.||uv.x>1.||uv.y<0.||uv.y>1.)continue;
 vec4 t=chTex(i,uv);vec3 col=t.rgb*mix(.5,1.,uSp[i]);col=mix(col,col*vec3(.82,.9,1.08)+vec3(.02,.03,.05),gh*.6);
 float a=t.a*ch.y*mix(1.,.72+.06*sin(uTime*2.+p.y*.02),gh)*(1.-gh*smoothstep(.62,1.,uv.y)*.85);
 c=mix(c,col,a);}return c;}
vec3 world(vec2 p){vec3 c;
 if(uBgOn>.5){c=texture2D(uBg,cover(p)).rgb;}else c=uScene<.5?lab(p):(uScene<1.5?obs(p):church(p));
 if(uFxOn>.5){vec2 uv=p/uRes;
  if(uFx.x>0.){vec3 s=texture2D(uFxS,uv*vec2(1.,.5625)+vec2(uTime*.045,-uTime*.03)).rgb;c+=s*uFx.x*(.75+.25*sin(uTime*.7));}
  if(uFx.y>0.){vec3 k=texture2D(uFxK,uv*vec2(1.6,.9)+vec2(0.,uTime*.004)).rgb;c+=k*uFx.y*(.55+.45*sin(uTime*2.3+uv.x*20.+uv.y*13.));}
  if(uMeteor>0.){vec2 m=mix(vec2(1500.,60.),vec2(560.,560.),uMeteor);vec2 mu=(p-m)/vec2(900.,600.)+.5;
   if(mu.x>0.&&mu.x<1.&&mu.y>0.&&mu.y<1.)c+=texture2D(uFxM,mu).rgb*1.6*(1.-uMeteor*.5)*smoothstep(0.,.12,uMeteor);}}
 c=chars(c,p);c=sprites(c,p);
 if(uCGA>0.)c=mix(c,texture2D(uCG,cover(p)).rgb,uCGA);
 return c;}
void main(){vec2 p=vec2(gl_FragCoord.x/uPx,uRes.y-gl_FragCoord.y/uPx);vec3 c=world(p);float sh=0.;
 for(int i=0;i<14;i++){if(i>=uGN)break;float a=uGA[i];if(a<=0.)continue;vec4 g=uGlass[i];vec2 hb=g.zw*.5,hc=g.xy+hb;float r=min(uGR[i],min(hb.x,hb.y));
  float d=sdB(p-hc,hb,r);if(d>0.){sh=max(sh,a*.32*exp(-d/16.));continue;}
  vec2 n=normalize(vec2(sdB(p-hc+vec2(1.,0.),hb,r)-sdB(p-hc-vec2(1.,0.),hb,r),sdB(p-hc+vec2(0.,1.),hb,r)-sdB(p-hc-vec2(0.,1.),hb,r))+1e-5);
  float bend=pow(1.-clamp(-d/38.,0.,1.),2.2);vec2 off=-n*bend*52.;vec3 acc=vec3(0.);
  for(int k=0;k<4;k++){float fk=float(k);vec2 j=vec2(cos(fk*1.57+.7),sin(fk*1.57+.7))*8.;
   acc.r+=world(p+off*1.1+j).r;acc.g+=world(p+off+j).g;acc.b+=world(p+off*.9+j).b;}
  vec3 gc=acc*.25*.7+vec3(.03,.032,.042);
  gc+=vec3(1.)*bend*(.14+.6*max(dot(n,normalize(vec2(-.45,-.9))),0.))*.6;
  gc+=vec3(1.)*.045*(1.-smoothstep(0.,g.w*.6,p.y-g.y));
  gc+=vec3(1.,.95,.84)*exp(d*1.2)*.3;
  c=mix(c,gc,a);sh=0.;break;}
 c*=1.-sh;
 for(int i=0;i<4;i++){float pr=uCP[i];if(pr<=0.)continue;float fi=float(i);
  vec2 cn=vec2(mod(fi,2.)*1920.,floor(fi/2.)*1080.);float e=1.-pow(1.-pr,3.);
  float d=length((p-cn)*vec2(1.,1.25))-mix(0.,760.,e)+(fbm(p*.005+fi*5.3)*2.-1.)*120.*(.35+.65*e)+(fbm(p*.03+fi*2.1)*2.-1.)*20.;
  if(d>260.)continue;
  float ink=1.-smoothstep(-2.,2.,d);
  c=mix(c,c*.45,exp(-max(d,0.)*.025)*(1.-ink)*.75*e);
  vec3 inkColor=vec3(.014,.013,.02)+vec3(.035,.03,.045)*fbm(p*.02+uTime*.03);
#ifdef INK_TEXTURE
  if(uInkOn>.5){
   vec2 grainUV=abs(p-cn)/vec2(850.,850.);
   float grain=texture2D(uInk,grainUV).r;
   inkColor=mix(inkColor,mix(vec3(.008,.007,.012),vec3(.11,.096,.10),grain),.78);
  }
#endif
  c=mix(c,inkColor,ink*.95);
  c+=vec3(.86,.68,.33)*exp(-abs(d)*.35)*(.18+.5*uCH[i])*e;}
 vec2 v=p/uRes-.5;c*=1.-dot(v,v)*.6;gl_FragColor=vec4(c,1.);}`;

let gl = null, U = {}, px = 1, scale = 1, useInkTexture = false;
function fit(){
  scale = Math.min(innerWidth/1920, innerHeight/1080);
  stage.style.transform = `translate(-50%,-50%) scale(${scale})`;
  px = Math.min(1, scale*(devicePixelRatio||1));
  cv.width = Math.round(1920*px); cv.height = Math.round(1080*px);
  if (gl) gl.viewport(0,0,cv.width,cv.height);
}
function initGL(){
  gl = cv.getContext('webgl', {antialias:false, alpha:false});
  if (!gl) return false;
  const sh = (t,src)=>{ const s=gl.createShader(t); gl.shaderSource(s,src); gl.compileShader(s); if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
  useInkTexture = gl.getParameter(gl.MAX_TEXTURE_IMAGE_UNITS) >= 9;
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, useInkTexture ? '#define INK_TEXTURE\n' + FS : FS));
  gl.bindAttribLocation(pr, 0, 'a');
  gl.linkProgram(pr); if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
  gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  for (const n of ['uRes','uPx','uTime','uScene','uMeteor','uChar','uCol','uSp','uGlass','uGR','uGA','uGN','uCP','uCH',
    'uBgOn','uCGA','uFxOn','uTOn','uTR','uFx']) U[n] = gl.getUniformLocation(pr, n);
  ['uBg','uCG','uT0','uT1','uT2','uFxM','uFxS','uFxK'].forEach((n,i)=>gl.uniform1i(gl.getUniformLocation(pr,n), i));
  if (useInkTexture){
    gl.uniform1i(gl.getUniformLocation(pr, 'uInk'), 8);
    U.uInkOn = gl.getUniformLocation(pr, 'uInkOn');
  }
  return true;
}
/* 画像テクスチャ。読み込めなかったものは手続き描画にフォールバック */
const TEX = {};
function tex(url, repeat){
  if (!url) return null;
  if (TEX[url]) return TEX[url];
  const t = { gl: gl.createTexture(), ready:false, w:1, h:1 };
  const img = new Image();
  img.onload = ()=>{
    gl.bindTexture(gl.TEXTURE_2D, t.gl);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    const wrap = repeat ? gl.REPEAT : gl.CLAMP_TO_EDGE;
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    t.w = img.width; t.h = img.height; t.ready = true;
  };
  img.onerror = ()=>console.warn('画像を読み込めません', url);
  img.src = url; TEX[url] = t; return t;
}
function bindTex(unit, t){ gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D, t && t.ready ? t.gl : null); return !!(t && t.ready); }
const tOn = new Float32Array(3), tR = new Float32Array(12);
const gBuf = new Float32Array(56), gR = new Float32Array(14), gA = new Float32Array(14);
const cP = new Float32Array(4), cH = new Float32Array(4);
const cBuf = new Float32Array(12), colBuf = new Float32Array(9), spBuf = new Float32Array(3).fill(1);
let lastFrame = 0;
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
function frame(t){
  const brightnessBlend = reducedMotion.matches ? 1 : 1 - Math.exp(-(t-lastFrame)/90);
  lastFrame = t;
  const sr = stage.getBoundingClientRect(); let n = 0;
  for (const el of document.querySelectorAll('.glass')){
    if (n >= 14) break;
    const b = el.getBoundingClientRect(); if (!b.width) continue;
    const op = parseFloat(getComputedStyle(el).opacity); if (op <= 0) continue;
    gBuf.set([(b.left-sr.left)/scale, (b.top-sr.top)/scale, b.width/scale, b.height/scale], n*4);
    gR[n] = parseFloat(getComputedStyle(el).borderTopLeftRadius) || 0; gA[n] = op; n++;
  }
  cP.fill(0); cH.fill(0);
  for (const el of document.querySelectorAll('#choices:not(.hidden) .ink')){
    const k = Number(el.dataset.slot);
    cP[k] = Math.max(0, Math.min(1, (t - Number(el.dataset.t0)) / 1600)); cH[k] = el.matches(':hover,:focus-visible') ? 1 : 0;
  }
  R.chars.forEach((c,i)=>{ cBuf.set([SLOT_X[i], c.a, c.s, c.g], i*4); colBuf.set(c.c, i*3); spBuf[i] += (c.sp - spBuf[i]) * brightnessBlend; });
  gl.uniform2f(U.uRes,1920,1080); gl.uniform1f(U.uPx,px); gl.uniform1f(U.uTime,t/1000);
  gl.uniform1f(U.uScene, $('game').classList.contains('hidden') ? 0 : R.scene); gl.uniform1f(U.uMeteor, R.meteor);
  gl.uniform4fv(U.uChar,cBuf); gl.uniform3fv(U.uCol,colBuf); gl.uniform1fv(U.uSp,spBuf);
  gl.uniform4fv(U.uGlass,gBuf); gl.uniform1fv(U.uGR,gR); gl.uniform1fv(U.uGA,gA); gl.uniform1i(U.uGN,n);
  gl.uniform4fv(U.uCP,cP); gl.uniform4fv(U.uCH,cH);
  const inGame = !$('game').classList.contains('hidden');
  gl.uniform1f(U.uBgOn, bindTex(0, inGame ? tex(BG_IMG[R.bg]) : null) ? 1 : 0);
  gl.uniform1f(U.uCGA, bindTex(1, tex(CG_IMG[R.cg])) ? R.cgA : 0);
  R.chars.forEach((c,i)=>{
    const ch = CHARS[c.id];
    let t = null;
    if (ch && c.a>0){ const v = ch.fx && ch.fx[c.fx] ? tex(ch.fx[c.fx]) : null; t = v && v.ready ? v : tex(ch.img); }
    const ok = bindTex(2+i, t);
    tOn[i] = ok ? 1 : 0;
    if (ok){ const h = ch.cm*8, w = h*t.w/t.h; tR.set([SLOT_X[i]-w/2, 1080+400-h, w, h], i*4); }
  });
  gl.uniform1fv(U.uTOn, tOn); gl.uniform4fv(U.uTR, tR);
  const fm = bindTex(5, tex(FX_IMG.meteor)), fs = bindTex(6, tex(FX_IMG.shower, true)), fk = bindTex(7, tex(FX_IMG.sparkle, true));
  gl.uniform1f(U.uFxOn, fm||fs||fk ? 1 : 0); gl.uniform2f(U.uFx, fs ? R.shower : 0, fk ? R.sparkle : 0);
  if (useInkTexture){
    gl.uniform1f(U.uInkOn, bindTex(8, inGame ? tex('assets/ui_ink.webp') : null) ? 1 : 0);
  }
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(frame);
}
addEventListener('resize', fit);
fit();
sky.start();
let ok = false;
try { ok = initGL(); } catch (err) { console.warn('WebGL初期化に失敗。CSSの硝子で表示します', err); }
if (ok){ fit(); requestAnimationFrame(frame); } else document.body.classList.add('nogl');
$('fader').style.opacity = 0;
}
